[project]
name = "grocery-management-backend"
version = "0.1.0"
description = "Backend API for GroceryManagement-AgentBenchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pymupdf>=1.24.0,<1.26.0",
    "pypdf>=5.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=5.1.0.95",
    "numpy>=2.4.6",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
